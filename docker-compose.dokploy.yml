# Platform-neutral production stack adapted for Dokploy
# TLS + reverse proxy are handled externally by Dokploy's Traefik.
#
# TWO database roles by design: the SUPERUSER (runs migrations) and the
# NON-superuser runtime role (what the server runs as, ensuring RLS).

services:
  agents:
    image: ${AGENTS_IMAGE:-ghcr.io/fazer-ai/agents:latest}
    pull_policy: always
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PUBLIC_URL=${PUBLIC_URL}
      - CDN_URL=${PUBLIC_URL}
      - CORS_ORIGIN=${CORS_ORIGIN:-${PUBLIC_URL}}
      - SETUP_TOKEN_REQUIRED=${SETUP_TOKEN_REQUIRED:-false}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      
      # MIGRATION URL uses the superuser credentials
      - MIGRATION_DATABASE_URL=postgres://${DB_SUPER_USER}:${DB_SUPER_PASSWORD}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-secretaria_v4_db}
      
      # APP URL uses the restricted application credentials
      - DATABASE_URL=postgres://${DB_APP_USER}:${DB_APP_PASSWORD}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-secretaria_v4_db}
      - LANGGRAPH_DATABASE_URL=postgres://${DB_APP_USER}:${DB_APP_PASSWORD}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-secretaria_v4_db}
      
      - BRANDING_STORAGE_DIR=/app/storage/branding
      - QUOTES_STORAGE_DIR=/app/storage/quotes
      - MCP_DCR_ENABLED=true
    ports:
      - '3000:3000'
    volumes:
      - 'storage:/app/storage'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 20s
      timeout: 10s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: 'pgvector/pgvector:pg17'
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME:-secretaria_v4_db}
      - POSTGRES_USER=${DB_SUPER_USER}
      - POSTGRES_PASSWORD=${DB_SUPER_PASSWORD}
    volumes:
      - 'postgres:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h localhost -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}'
      interval: 20s
      timeout: 20s
      retries: 10

volumes:
  storage:
  postgres: